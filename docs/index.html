<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAIR Readiness Survey</title><style>body{max-width:760px;margin:42px auto;padding:0 18px;background:#f5f7fb;color:#172033;font:16px system-ui}.card{background:white;border:1px solid #dce4f0;border-radius:16px;padding:28px}button,select{padding:10px 14px;border-radius:8px;font:inherit}button{border:0;background:#245bd5;color:white;font-weight:700;cursor:pointer}.answers{display:flex;gap:8px;flex-wrap:wrap}.answers button{background:#fff;color:#245bd5;border:1px solid #b8c9ec}.hidden{display:none}.bar{height:10px;background:#e7edf5;border-radius:99px;margin:18px 0}.bar i{display:block;height:100%;background:#3477da}.tag{color:#275bc6;font-weight:700}.rec{border-left:4px solid #e5ac30;background:#fffbf1;padding:12px;margin:10px 0}</style></head><body><main class="card"><section id="start"><span class="tag">HEAIR • Higher Education AI Readiness</span><h1>Readiness survey</h1><p>Answer twelve role-adaptive questions and receive a readiness report.</p><select id="role"><option>Student</option><option>Faculty</option><option>Administrator / Leadership</option><option>IT Staff</option><option>Academic / Business Affairs Staff</option></select><button onclick="start()">Start assessment</button></section><section id="survey" class="hidden"><span id="counter" class="tag"></span><div class="bar"><i id="bar"></i></div><p id="dimension"></p><h2 id="question"></h2><div class="answers" id="answers"></div></section><section id="result" class="hidden"><span class="tag">Your readiness report</span><h1 id="score"></h1><p id="summary"></p><div id="actions"></div><button onclick="location.reload()">Start again</button></section></main><script src="config.js"></script><script>
const qs=[['Policy & Compliance','Governance & Strategy','Review and communicate practical AI policy guidance.'],['AI Governance & Access','Governance & Strategy','Publish an equitable AI tool approval and access pathway.'],['Leadership & Resourcing','Governance & Strategy','Assign accountable leadership and fund a focused plan.'],['Monitoring & Evaluation','Governance & Strategy','Measure AI risks, outcomes, and stakeholder feedback.'],['Infrastructure, Privacy & Security','Systems & Infrastructure','Review privacy, security, and accessibility controls.'],['Data','Systems & Infrastructure','Document data quality, stewardship, and access controls.'],['AI Integration & Use Cases','Systems & Infrastructure','Prioritize measurable, responsibly governed AI use cases.'],['Trust & Transparency','Culture','Explain AI use, limits, and challenge mechanisms.'],['Ethics & Responsible Use','Culture','Provide scenario-based responsible-AI guidance.'],['Stakeholder Engagement & Awareness','Culture','Create feedback and awareness channels.'],['AI Literacy','Education','Offer role-relevant AI literacy learning.'],['Expertise Development','Education','Create advanced learning pathways.']];let i=0,a=[];const $=x=>document.getElementById(x);function start(){$('start').classList.add('hidden');$('survey').classList.remove('hidden');render()}function render(){let q=qs[i];$('counter').textContent='Question '+(i+1)+' of 12';$('bar').style.width=(i/12*100)+'%';$('dimension').textContent=q[1];$('question').textContent='How ready are you for '+q[0]+'?';$('answers').innerHTML=[['Low',1],['Fair',2],['Moderate',3],['Good',4],['High',5]].map(x=>'<button onclick="answer('+x[1]+')">'+x[0]+'</button>').join('')}function answer(v){a.push((v-1)*25);if(++i<12)render();else report()}async function report(){$('survey').classList.add('hidden');$('result').classList.remove('hidden');let overall=a.reduce((x,y)=>x+y,0)/12,order=[...a.keys()].sort((x,y)=>a[x]-a[y]),weak=order.slice(0,3).map(x=>({subDimension:qs[x][0],score:a[x]})),strong=order.slice(-3).reverse().map(x=>({subDimension:qs[x][0],score:a[x]}));$('score').textContent=overall.toFixed(1)+' / 100';$('summary').textContent='Focus first on '+weak.map(x=>x.subDimension).join(', ')+'.';$('actions').innerHTML=weak.map(x=>'<div class="rec"><b>Improve '+x.subDimension+'</b><br>'+qs.find(q=>q[0]===x.subDimension)[2]+'</div>').join('');if(window.HEAIR_API_URL){try{let r=await fetch(window.HEAIR_API_URL.replace(/\/$/,'')+'/public/recommendations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role:$('role').value,overallScore:overall,weakest:weak,strongest:strong})});let d=await r.json();if(r.ok)$('summary').textContent=d.summary}catch{}}}</script></body></html>
