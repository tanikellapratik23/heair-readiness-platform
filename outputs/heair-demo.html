<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAIR Readiness Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:860px;margin:42px auto;padding:0 18px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:16px;padding:30px;box-shadow:0 9px 30px #1026500d}h1{margin:0 0 10px;font-size:30px}h2{margin-top:0}.tag{display:inline-block;padding:5px 10px;border-radius:99px;background:#ecf3ff;color:#275ac3;font-size:13px;font-weight:700}p{color:#58667e;line-height:1.55}select,button{font:inherit;border-radius:9px;padding:11px 13px}select{display:block;width:100%;margin:10px 0 20px;border:1px solid #ccd5e4;background:#fff}button{background:#245bd5;color:#fff;border:0;font-weight:700;cursor:pointer}button:hover{background:#1a49b5}.hidden{display:none}.progress,.bar{height:10px;background:#e7edf5;border-radius:99px;overflow:hidden}.progress i,.bar i{display:block;height:100%;background:#3878dc}.progress{margin:20px 0}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.choices button{background:#fff;color:#245bd5;border:1px solid #b9caed;min-width:74px}.choices button:hover{background:#245bd5;color:#fff}.score{font-size:44px;font-weight:800;color:#245bd5}.dim{margin:14px 0}.rec{margin:10px 0;padding:12px 14px;border-left:4px solid #e4a52d;background:#fffbf1}.muted{font-size:13px;color:#78859b}
</style></head><body><main class="wrap"><section id="start" class="card"><span class="tag">Zero-install interactive demo</span><h1>HEAIR Readiness Platform</h1><p>Choose a stakeholder role, complete the 12 HEAIR readiness questions, and receive a personalized report. Nothing is stored.</p><label for="role">Stakeholder role</label><select id="role"><option value="Student">Student</option><option value="Faculty">Faculty</option><option value="Administrator / Leadership">Administrator / Leadership</option><option value="IT Staff">IT Staff</option><option value="Academic / Business Affairs Staff">Academic / Business Affairs Staff</option></select><button onclick="begin()">Start assessment</button></section><section id="quiz" class="card hidden"><span id="step" class="tag"></span><div class="progress"><i id="prog"></i></div><p id="dim" class="muted"></p><h2 id="question"></h2><p>How would you rate your current experience?</p><div id="answers" class="choices"></div></section><section id="report" class="card hidden"><span class="tag">Readiness report</span><h1>Your HEAIR Results</h1><div id="score" class="score"></div><p id="summary"></p><h2>Dimension scores</h2><div id="dims"></div><h2>Priority actions</h2><div id="actions"></div><button onclick="location.reload()">Try another role</button></section></main><script>
const qs=[['Policy & Compliance','Governance & Strategy','Review and communicate practical AI policy and escalation guidance.'],['AI Governance & Access','Governance & Strategy','Publish a simple, equitable pathway for AI tool approval and access.'],['Leadership & Resourcing','Governance & Strategy','Assign accountable leadership and fund a focused improvement plan.'],['Monitoring & Evaluation','Governance & Strategy','Measure AI outcomes, risks, and stakeholder feedback routinely.'],['Infrastructure, Privacy & Security','Systems & Infrastructure','Review approved AI tools for privacy, security, accessibility, and data protection.'],['Data','Systems & Infrastructure','Document data quality, stewardship, access controls, and permissible AI data flows.'],['AI Integration & Use Cases','Systems & Infrastructure','Prioritize measurable, responsibly governed AI use cases.'],['Trust & Transparency','Culture','Explain where AI is used, what it does, its limits, and how people can challenge outcomes.'],['Ethics & Responsible Use','Culture','Provide scenario-based responsible-AI guidance for this role.'],['Stakeholder Engagement & Awareness','Culture','Create recurring channels for feedback, communication, and awareness.'],['AI Literacy','Education','Offer role-relevant AI literacy on capabilities, limitations, risks, and verification.'],['Expertise Development','Education','Create advanced learning pathways and communities of practice.']];let i=0,a=[],r='';const $=x=>document.getElementById(x);function begin(){r=$('role').value;$('start').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){let q=qs[i];$('step').textContent='Question '+(i+1)+' of 12';$('prog').style.width=(i/12*100)+'%';$('dim').textContent=q[1];$('question').textContent='As '+r+', how ready are you for '+q[0]+'?';$('answers').innerHTML=[['Low',1],['Fair',2],['Moderate',3],['Good',4],['High',5]].map(x=>'<button onclick="answer('+x[1]+')">'+x[0]+'</button>').join('')}function answer(n){a.push((n-1)*25);if(++i<12)render();else finish()}function finish(){$('quiz').classList.add('hidden');$('report').classList.remove('hidden');let all=a.reduce((x,y)=>x+y,0)/12;$('score').textContent=all.toFixed(1)+' / 100';let weak=[...a.keys()].sort((x,y)=>a[x]-a[y]).slice(0,3);$('summary').textContent='Your highest-priority opportunities are '+weak.map(x=>qs[x][0]).join(', ')+'.';let g={};qs.forEach((q,x)=>(g[q[1]]??=[]).push(a[x]));$('dims').innerHTML=Object.entries(g).map(([n,v])=>{let z=v.reduce((x,y)=>x+y,0)/v.length;return '<div class="dim"><b>'+n+'</b> <span class="muted">'+z.toFixed(0)+'/100</span><div class="bar"><i style="width:'+z+'%"></i></div></div>'}).join('');$('actions').innerHTML=weak.map(x=>'<div class="rec"><b>Improve '+qs[x][0]+'</b><br>'+qs[x][2]+'</div>').join('')}
</script></body></html>
